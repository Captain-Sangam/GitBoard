name: CI

on:
  pull_request:

jobs:
  lint-python:
    name: Lint Python (jobs/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Python
        uses: astral-sh/ruff-action@v3
        with:
          src: jobs/
          version: "0.17.1"
          args: check

      - name: Check Python formatting
        run: ruff format --check jobs/

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: touch .env

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
